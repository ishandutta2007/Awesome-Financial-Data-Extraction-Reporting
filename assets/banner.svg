<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes floatChart {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -100; }
    }
    @keyframes pulsePill {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6)); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 150px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 250px; }
    .stream-line { stroke-dasharray: 8 6; animation: dashStream 4s linear infinite; }
    .stream-line-rev { stroke-dasharray: 6 6; animation: dashStream 6s linear infinite reverse; }
    .floating-card { animation: floatChart 6s ease-in-out infinite; }
    .floating-card-delayed { animation: floatChart 6s ease-in-out infinite 3s; }
    .pill-animated { animation: pulsePill 4s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.5px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .mono-text { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="140" r="160" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="240" r="180" fill="#818cf8" opacity="0.2" filter="url(#glow)" />
  <circle cx="600" cy="380" r="140" fill="#c084fc" opacity="0.15" filter="url(#glow)" />

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Animated Data Stream Lines (Flowing Across Background) -->
  <path class="stream-line" d="M 0 320 Q 300 240 600 310 T 1200 260" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path class="stream-line-rev" d="M 0 100 Q 350 180 700 90 T 1200 140" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.3" />
  <path class="stream-line" d="M 150 420 Q 450 310 800 370 T 1200 330" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.35" />

  <!-- Decorative Dynamic Background Elements (Cards & Visualizer) -->
  <!-- Floating Financial Metric Card 1 (Right Side) -->
  <g class="floating-card" opacity="0.75">
    <rect x="910" y="55" width="230" height="110" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
    <text x="930" y="85" fill="#94a3b8" font-size="12" class="mono-text">METRIC // NET REVENUE</text>
    <text x="930" y="118" fill="#38bdf8" font-size="24" font-weight="700" class="title-text">$24,850,210</text>
    <text x="930" y="145" fill="#10b981" font-size="12" font-weight="600" class="mono-text">▲ +34.2% YoY (Audited)</text>
    <!-- Sparkline -->
    <path d="M 1040 140 Q 1060 120 1080 132 T 1120 110" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Floating Pipeline Card 2 (Lower Right) -->
  <g class="floating-card-delayed" opacity="0.75">
    <rect x="870" y="225" width="280" height="135" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <text x="890" y="255" fill="#94a3b8" font-size="12" class="mono-text">PIPELINE // ELT STATUS</text>
    <circle cx="896" cy="282" r="5" fill="#10b981" />
    <text x="910" y="286" fill="#f1f5f9" font-size="13" font-weight="600" class="sub-text">Stripe &amp; Chargebee: Sync'd</text>
    <circle cx="896" cy="310" r="5" fill="#38bdf8" />
    <text x="910" y="314" fill="#f1f5f9" font-size="13" font-weight="600" class="sub-text">Warehouse Push-down: 0s lag</text>
    <rect x="890" y="335" width="240" height="6" rx="3" fill="#1e293b" />
    <rect x="890" y="335" width="200" height="6" rx="3" fill="url(#primaryGrad)" />
  </g>

  <!-- Dynamic Foreground Content: Badge, Title, Subtitle, Feature Pills -->
  <g transform="translate(70, 0)">
    
    <!-- Top Category Tag -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="260" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#10b981" />
      <text x="30" y="20" fill="#38bdf8" font-size="11.5" font-weight="700" class="mono-text" letter-spacing="1">CURATED DATA ECOSYSTEM</text>
    </g>

    <!-- Main Title (Guaranteed Sharp Foreground) -->
    <text x="0" y="150" fill="url(#primaryGrad)" font-size="44" class="title-text" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Awesome Financial Data
    </text>
    <text x="0" y="202" fill="#ffffff" font-size="38" class="title-text" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Extraction &amp; Reporting
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="248" fill="#94a3b8" font-size="17" class="sub-text">
      The authoritative landscape for Managed ELT, Data Pipelines, &amp; Warehouse Ingestion.
    </text>

    <!-- Feature Pills (Pulsing / Vibrant) -->
    <g transform="translate(2, 285)">
      <!-- Pill 1 -->
      <g class="pill-animated">
        <rect x="0" y="0" width="138" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" />
        <text x="20" y="22" fill="#38bdf8" font-size="13" font-weight="600" class="mono-text">⚡ Managed ELT</text>
      </g>
      <!-- Pill 2 -->
      <g class="pill-animated" transform="translate(150, 0)">
        <rect x="0" y="0" width="158" height="36" rx="18" fill="#0f172a" stroke="#818cf8" stroke-width="1.3" />
        <text x="20" y="22" fill="#a5b4fc" font-size="13" font-weight="600" class="mono-text">🔄 Data Pipelines</text>
      </g>
      <!-- Pill 3 -->
      <g class="pill-animated" transform="translate(320, 0)">
        <rect x="0" y="0" width="154" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="1.3" />
        <text x="20" y="22" fill="#34d399" font-size="13" font-weight="600" class="mono-text">📊 Ledger Syncs</text>
      </g>
      <!-- Pill 4 -->
      <g class="pill-animated" transform="translate(486, 0)">
        <rect x="0" y="0" width="168" height="36" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3" />
        <text x="18" y="22" fill="#fbbf24" font-size="13" font-weight="600" class="mono-text">⭐ 100% Free / OSS</text>
      </g>
    </g>

    <!-- Footer Stats / Meta -->
    <g transform="translate(2, 360)">
      <text x="0" y="0" fill="#64748b" font-size="13" class="mono-text">
        UPDATED 2026 • SAAS &amp; OPEN SOURCE • REVENUE &amp; BILLING ORCHESTRATION
      </text>
    </g>

  </g>
</svg>
